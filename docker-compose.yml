
services:
  postgres:
    image: postgres:16-alpine
    container_name: aquapass-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: aquapass_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: SecretPassword123!
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: aquapass-cache
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./AquaPass 
      dockerfile: Dockerfile
    container_name: aquapass-api
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=aquapass_db;Username=postgres;Password=SecretPassword123!
      - ConnectionStrings__Redis=redis:6379
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./front_aqua 
      dockerfile: Dockerfile
    container_name: aquapass-ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata: